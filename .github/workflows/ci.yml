name: Проверка

# Один ручной запуск на готовый набор перед выпуском: Actions → Проверка → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Версии
        run: |
          python --version
          ffmpeg -hide_banner -version
      - name: Тесты
        run: python -B -m unittest discover -s tests -v
