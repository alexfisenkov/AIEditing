<!doctype html>
<html lang="ru">
<!-- «Файлы»: a heading and file names in mono, each with a file mark, coming in one after another.
     Filled by runtime/render/anim_page.py (placeholders in double braces: style, w, h, seconds, title;
     the marked row repeats per item with n, text, delay). No sound, no network, no script. -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{w}}, height={{h}}" />
<style>
{{style}}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: {{w}}px; height: {{h}}px; overflow: hidden; background: transparent; }
#root, #ins { position: absolute; inset: 0; }
#panel { position: absolute; inset: 0; padding: var(--pad); border-radius: var(--radius); background: var(--bg);
  border: 1.5px solid var(--line); overflow: hidden;
  animation: ae-in var(--enter) var(--ease) 0s 1 both, ae-out var(--exit) ease-in var(--out-at) 1 forwards; }
#title { font-family: "ae-display"; font-weight: var(--title-weight); font-size: var(--title-size);
  line-height: 1.25; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: calc(var(--body-size) * 0.6); animation: ae-rise var(--enter) var(--ease) 0.08s 1 both; }
#title:empty { display: none; }
.row { display: flex; align-items: center; gap: calc(var(--body-size) * 0.6);
  height: calc(var(--body-size) * var(--row)); color: var(--body-fg);
  animation: ae-rise var(--enter) var(--ease) 0s 1 both; }
.mark { flex: none; width: calc(var(--body-size) * 0.8); height: var(--body-size); border: 1.5px solid var(--body-fg);
  border-radius: calc(var(--body-size) * 0.12); clip-path: polygon(0 0, 68% 0, 100% 30%, 100% 100%, 0 100%); }
.name { font-family: "ae-mono"; font-size: var(--body-size); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
@keyframes ae-in { from { opacity: 0; transform: scale(0.96); filter: blur(8px); }
  to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes ae-out { from { opacity: 1; filter: blur(0); } to { opacity: 0; filter: blur(6px); } }
@keyframes ae-rise { from { opacity: 0; transform: translateY(0.5em); filter: blur(4px); }
  to { opacity: 1; transform: none; filter: blur(0); } }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="{{seconds}}"
     data-width="{{w}}" data-height="{{h}}">
  <div id="ins" class="clip" data-start="0" data-duration="{{seconds}}">
    <div id="panel">
      <div id="title">{{title}}</div>
      <!--item--><div class="row" style="animation-delay:{{delay}}"><span class="mark"></span><span class="name">{{text}}</span></div><!--/item-->
    </div>
  </div>
</div>
</body>
</html>
